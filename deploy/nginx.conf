server {
    listen 443 ssl;
    server_name beertime.example.com;

    ssl_certificate     /etc/letsencrypt/live/beertime.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beertime.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name beertime.example.com;
    return 301 https://$host$request_uri;
}
