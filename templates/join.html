{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Кто ты?</h1>
  <form method="post" action="/b/{{ secret }}/join">
    {% if people %}
    <label class="field">
      <span>Я в списке</span>
      <select name="person_id">
        <option value="">— я новенький —</option>
        {% for p in people %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
      </select>
    </label>
    {% else %}
    <input type="hidden" name="person_id" value="">
    {% endif %}
    <label class="field">
      <span>Имя, если новенький</span>
      <input name="name" placeholder="Как тебя зовут">
    </label>
    <button type="submit" class="btn">Войти</button>
  </form>
</div>
{% endblock %}
