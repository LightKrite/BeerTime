{% extends "base.html" %}
{% block content %}
<h1>Кто ты?</h1>
<form method="post" action="/b/{{ secret }}/join">
  {% if people %}
  <select name="person_id">
    <option value="">— я новенький —</option>
    {% for p in people %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
  </select>
  {% else %}
  <input type="hidden" name="person_id" value="">
  {% endif %}
  <input name="name" placeholder="Имя, если новенький">
  <button type="submit">Войти</button>
</form>
{% endblock %}
